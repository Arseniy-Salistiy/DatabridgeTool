<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DataBridge — Отчёт о валидации</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { padding: 15px 25px; border-radius: 8px; background: #f4f6f8; border: 1px solid #ddd; }
        .card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Отчёт об обработке данных (DataBridge)</h1>
    <div class="stats">
        <div class="card"><h3>Всего записей</h3><p>2</p></div>
        <div class="card"><h3>Успешно</h3><p style="color: green;">1</p></div>
        <div class="card"><h3>С ошибками</h3><p style="color: red;">1</p></div>
    </div>
    <h2>Детализация ошибок</h2>
    <table>
        <thead>
            <tr>
                <th>Строка</th>
                <th>Поле</th>
                <th>Значение</th>
                <th>Описание ошибки</th>
            </tr>
        </thead>
        <tbody>
            
        <tr>
            <td>2</td>
            <td>email</td>
            <td>maria.mail.ru</td>
            <td>поле &quot;email&quot; не соответствует формату</td>
        </tr>
        
        </tbody>
    </table>
</body>
</html>
