fields:
  - name: id
    type: integer
    required: true
    unique: true
  - name: name
    rename_to: full_name
    type: string
    required: true
    min_length: 2
    transform: trim
  - name: email
    type: string
    required: true
    pattern: "^[^@]+@[^@]+\\.[^@]+$"
    transform: lower
  - name: age
    type: integer
    min: 16
    max: 100
  - name: birth_date
    type: date
    format: "YYYY-MM-DD"
